[package]
name = "passport-buss-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "BUSS (ANARKey, EPRINT 2025/551) bindings for the Passport account-custody prototype — wraps arc-pleiades (Pleiades) for use from TypeScript"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-pleiades = { git = "https://github.com/input-output-hk/arc-pleiades.git", rev = "ae179e7e6dde546409c37f3de2c69d077e4d6e84" }
midnight-curves = "0.3"
ff = "0.13"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
