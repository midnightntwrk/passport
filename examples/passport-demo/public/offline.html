<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/midnight-symbol.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Midnight Passport · Offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: #f5f5f3;
        background: #0a0a0a;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      main {
        width: min(100% - 48px, 1040px);
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) 0 max(30px, env(safe-area-inset-bottom));
      }
      header { display: flex; align-items: center; gap: 12px; }
      header img { width: 116px; filter: invert(1); }
      header span { width: 1px; height: 19px; background: #666; }
      header strong { font-size: 14px; }
      section { max-width: 690px; align-self: center; padding: 72px 0; }
      h1 {
        max-width: 640px;
        margin: 0;
        font-size: 112px;
        line-height: .84;
        letter-spacing: 0;
      }
      p { max-width: 540px; margin: 28px 0 0; color: #b7b7b2; font-size: 15px; line-height: 1.6; }
      .retry-link {
        min-height: 46px;
        width: fit-content;
        display: inline-flex;
        align-items: center;
        margin-top: 34px;
        padding: 0 18px;
        border: 1px solid #f5f5f3;
        color: #0a0a0a;
        background: #f5f5f3;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      footer { color: #888; font-size: 11px; line-height: 1.5; }
      @media (max-width: 560px) {
        main { width: min(100% - 36px, 1040px); }
        h1 { font-size: 58px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="/midnight-wordmark.svg" alt="Midnight" />
        <span aria-hidden="true"></span>
        <strong>Passport</strong>
      </header>
      <section>
        <h1>Passport is offline.</h1>
        <p>
          Reconnect to sign in, refresh balances, generate proofs, or submit transactions.
          This offline shell does not access or modify your encrypted Passport state.
        </p>
        <a class="retry-link" href="/">Try again</a>
      </section>
      <footer>Network operations are never queued or represented as completed while offline.</footer>
    </main>
  </body>
</html>
