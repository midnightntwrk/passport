<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme, before anything paints. This is the literal value of
         `themeInitScript` in src/lib/theme.ts — keep the two in step. Without
         it a stored dark preference would flash the light default first. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('passport-theme');
          var r = document.documentElement;
          if (p === 'light' || p === 'dark') {
            r.setAttribute('data-theme', p);
            r.style.colorScheme = p;
          } else if (p === 'system') {
            r.removeAttribute('data-theme');
            r.style.colorScheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            r.setAttribute('data-theme', 'light');
            r.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#e9e9e9" />
    <meta name="application-name" content="Midnight Passport" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Passport" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Your Midnight wallet, encrypted Passport state, and account permissions in one installable client."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/midnight-symbol.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <title>Midnight Passport</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
