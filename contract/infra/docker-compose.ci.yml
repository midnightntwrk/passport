# Fresh CI-only network. Tags explain the pins; manifest digests fix the images.
services:
  node:
    image: midnightntwrk/midnight-node:2.1.0-rc.4@sha256:9040c346c27f569b72dfbbad9420cf38fc7cc6a13b38adf814a925bbe9311678
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    ports: ['127.0.0.1:9944:9944']
    volumes: ['node-data:/data']
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
  indexer:
    image: ghcr.io/midnightntwrk/indexer-standalone:4.4.0-rc.6-b5e6c809@sha256:ecfec6a26b9f8f89b7531e8f7c390f841661fb079bdf0bc57fa2cf8bb3f99c2f
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports: ['127.0.0.1:8088:8088']
    volumes: ['indexer-data:/data']
    environment:
      APP__INFRA__SECRET: '${APP__INFRA__SECRET:?CI must supply a fresh indexer secret}'
      APP__INFRA__NODE__URL: ws://node:9944 # nosemgrep: private development bridge
      APP__INFRA__SPO_NODE__URL: ws://node:9944 # nosemgrep: private development bridge
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: dummy-not-using-spo
      RUST_LOG: info
  proof-server:
    image: midnightntwrk/proof-server:9.0.0-rc.8@sha256:2666c7bd7b4517f8ad135565387f98d14347a9ac715c6c466d4a8a852b545ecf
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports: ['127.0.0.1:6300:6300']
    environment:
      RAYON_NUM_THREADS: '2'
volumes:
  node-data:
  indexer-data:
